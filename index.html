<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>สแกนบัตรประชาชน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 28px 20px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.3rem;
      color: #1a237e;
      text-align: center;
      margin-bottom: 24px;
      font-weight: 700;
    }

    /* ---- STEP INDICATOR ---- */
    .steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .step-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #cfd8dc;
      transition: background 0.3s;
    }
    .step-dot.active { background: #1a237e; }

    /* ---- SECTION LABEL ---- */
    .section-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #546e7a;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ---- ID CARD UPLOAD ---- */
    .upload-area {
      border: 2px dashed #90a4ae;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #f9fbff;
      margin-bottom: 16px;
    }
    .upload-area:hover { border-color: #1a237e; background: #e8eaf6; }
    .upload-area svg { margin-bottom: 10px; }
    .upload-area p { color: #78909c; font-size: 0.9rem; }
    .upload-area p strong { color: #1a237e; }

    #photoInput { display: none; }

    /* ---- PREVIEW ---- */
    .preview-wrap {
      display: none;
      margin-bottom: 20px;
      text-align: center;
    }
    .preview-wrap img {
      max-height: 160px;
      border-radius: 10px;
      border: 2px solid #c5cae9;
      object-fit: contain;
      max-width: 100%;
    }
    .preview-wrap .retake-btn {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #1565c0;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
    }

    /* ---- DIVIDER ---- */
    .divider {
      height: 1px;
      background: #eceff1;
      margin: 20px 0;
    }

    /* ---- SIGNATURE ---- */
    .sig-wrapper {
      position: relative;
      border: 2px solid #90a4ae;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
      margin-bottom: 10px;
      touch-action: none;
    }
    #sigCanvas {
      display: block;
      width: 100%;
      cursor: crosshair;
    }
    .sig-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #b0bec5;
      font-size: 0.9rem;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .clear-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid #b0bec5;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      color: #546e7a;
      cursor: pointer;
      transition: background 0.2s;
    }
    .clear-btn:hover { background: #eceff1; }

    /* ---- ACTION BUTTONS ---- */
    .action-row {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-cancel {
      background: #eceff1;
      color: #546e7a;
    }
    .btn-cancel:hover { background: #cfd8dc; }

    .btn-submit {
      background: #1a237e;
      color: #fff;
    }
    .btn-submit:hover { background: #283593; }
    .btn-submit:disabled {
      background: #9fa8da;
      cursor: not-allowed;
    }

    /* ---- LOADING OVERLAY ---- */
    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.88);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #c5cae9;
      border-top-color: #1a237e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay p { color: #1a237e; font-weight: 600; }

    /* ---- SUCCESS / ERROR TOAST ---- */
    #toast {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
      z-index: 1000;
      animation: fadeIn 0.3s;
      white-space: nowrap;
    }
    #toast.success { background: #2e7d32; }
    #toast.error   { background: #c62828; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p id="loadingText">กำลังดำเนินการ...</p>
</div>

<div id="toast"></div>

<div class="container">
  <h1>📋 สแกนบัตรประชาชน</h1>

  <div class="steps">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
  </div>

  <!-- STEP 1: ID CARD PHOTO -->
  <div class="section-label">1. รูปบัตรประชาชน</div>

  <div class="upload-area" id="uploadArea" onclick="document.getElementById('photoInput').click()">
    <svg width="40" height="40" fill="none" stroke="#90a4ae" stroke-width="2" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>
    <p><strong>แตะที่นี่</strong> เพื่อถ่ายรูปหรือเลือกจากคลังภาพ</p>
    <p style="font-size:0.75rem; margin-top:6px; color:#b0bec5;">รองรับ JPG, PNG, HEIC</p>
  </div>

  <input type="file" id="photoInput" accept="image/*" capture="environment" />

  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" src="" alt="ตัวอย่างรูป" />
    <br/>
    <button class="retake-btn" onclick="retakePhoto()">📷 ถ่ายใหม่ / เปลี่ยนรูป</button>
  </div>

  <div class="divider"></div>

  <!-- STEP 2: SIGNATURE -->
  <div class="section-label">2. ลายเซ็น</div>

  <div class="sig-wrapper">
    <canvas id="sigCanvas" height="180"></canvas>
    <span class="sig-placeholder" id="sigPlaceholder">เขียนลายเซ็นที่นี่</span>
  </div>

  <button class="clear-btn" onclick="clearSignature()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
    </svg>
    ล้างลายเซ็น
  </button>

  <!-- ACTION BUTTONS -->
  <div class="action-row">
    <button class="btn btn-cancel" onclick="cancelAll()">ยกเลิก</button>
    <button class="btn btn-submit" id="submitBtn" onclick="submitForm()" disabled>เสร็จสิ้น ✓</button>
  </div>
</div>

<script>
  // =====================================================
  // CONFIG: แทนที่ URL นี้ด้วย URL ของ Google Apps Script
  // =====================================================
  const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_HERE";

  // ---- STATE ----
  let photoDataURL = null;
  let hasSig = false;

  // ---- PHOTO ----
  const photoInput = document.getElementById('photoInput');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg  = document.getElementById('previewImg');
  const uploadArea  = document.getElementById('uploadArea');

  photoInput.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      photoDataURL = e.target.result;
      previewImg.src = photoDataURL;
      previewWrap.style.display = 'block';
      uploadArea.style.display  = 'none';
      document.getElementById('dot1').classList.add('active');
      document.getElementById('dot2').classList.add('active');
      checkReady();
    };
    reader.readAsDataURL(file);
  });

  function retakePhoto() {
    photoDataURL = null;
    photoInput.value = '';
    previewWrap.style.display = 'none';
    uploadArea.style.display  = 'block';
    document.getElementById('dot2').classList.remove('active');
    checkReady();
  }

  // ---- SIGNATURE CANVAS ----
  const canvas = document.getElementById('sigCanvas');
  const ctx    = canvas.getContext('2d');
  const placeholder = document.getElementById('sigPlaceholder');

  function resizeCanvas() {
    const ratio  = window.devicePixelRatio || 1;
    const width  = canvas.offsetWidth;
    canvas.width  = width  * ratio;
    canvas.height = 180    * ratio;
    ctx.scale(ratio, ratio);
    ctx.strokeStyle = '#1a237e';
    ctx.lineWidth   = 2.5;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
  }
  // Wait for layout before sizing
  window.addEventListener('load', resizeCanvas);
  window.addEventListener('resize', () => {
    const hadSig = hasSig;
    resizeCanvas();
    if (!hadSig) placeholder.style.opacity = '1';
  });

  let drawing = false;
  let lastX = 0, lastY = 0;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src  = e.touches ? e.touches[0] : e;
    return {
      x: src.clientX - rect.left,
      y: src.clientY - rect.top
    };
  }

  canvas.addEventListener('mousedown',  startDraw);
  canvas.addEventListener('mousemove',  draw);
  canvas.addEventListener('mouseup',    endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove',  draw,      { passive: false });
  canvas.addEventListener('touchend',   endDraw);

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x; lastY = pos.y;
    placeholder.style.opacity = '0';
  }

  function draw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastX = pos.x; lastY = pos.y;
    hasSig = true;
    checkReady();
  }

  function endDraw() { drawing = false; }

  function clearSignature() {
    const ratio = window.devicePixelRatio || 1;
    ctx.clearRect(0, 0, canvas.width / ratio, canvas.height / ratio);
    hasSig = false;
    placeholder.style.opacity = '1';
    checkReady();
  }

  // ---- READY CHECK ----
  function checkReady() {
    document.getElementById('submitBtn').disabled = !(photoDataURL && hasSig);
  }

  // ---- CANCEL ----
  function cancelAll() {
    if (!confirm('ยืนยันการยกเลิก?')) return;
    retakePhoto();
    clearSignature();
  }

  // ---- SUBMIT ----
  async function submitForm() {
    if (!photoDataURL || !hasSig) return;

    const sigDataURL = canvas.toDataURL('image/png');

    showLoading('กำลังส่งข้อมูล...');

    try {
      const payload = {
        photo: photoDataURL,
        signature: sigDataURL,
        timestamp: new Date().toISOString()
      };

      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // Apps Script requires text/plain for doPost JSON
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.success) {
        showToast('✅ บันทึกสำเร็จ! PDF พร้อมใน Google Drive', 'success');
        setTimeout(() => {
          retakePhoto();
          clearSignature();
        }, 2500);
      } else {
        showToast('❌ ผิดพลาด: ' + (data.error || 'ไม่ทราบสาเหตุ'), 'error');
      }
    } catch (err) {
      showToast('❌ เชื่อมต่อไม่ได้: ' + err.message, 'error');
    } finally {
      hideLoading();
    }
  }

  // ---- UI HELPERS ----
  function showLoading(text) {
    document.getElementById('loadingText').textContent = text || 'กำลังดำเนินการ...';
    document.getElementById('loadingOverlay').classList.add('show');
  }
  function hideLoading() {
    document.getElementById('loadingOverlay').classList.remove('show');
  }
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = type;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }
</script>
</body>
</html>
